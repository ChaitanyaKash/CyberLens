secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
borderColor = "#D2D2D7"
showWidgetBorder = true
font = "sans-serif"
baseFontSize = 19
baseRadius = "large"
showSidebarBorder = false
