name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core package
        run: python -m pip install -e .
      - name: Check syntax
        run: python -m compileall -q cyberlens tests
      - name: Run available tests
        run: python -m unittest discover -s tests -v
      # Dataset/model integration tests explicitly skip in CI: private assets are not published.
