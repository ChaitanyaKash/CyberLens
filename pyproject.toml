[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberlens-classifier"
version = "0.1.0"
description = "Local English/Hinglish cybercrime classification with auditable data splits and from-scratch embedding experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.4"]

[project.optional-dependencies]
neural = ["torch>=2.4", "transformers>=4.45", "safetensors>=0.4"]
rag = ["pymupdf", "beautifulsoup4", "sentence-transformers"]

[project.scripts]
cyberlens = "cyberlens.cli:main"

[tool.setuptools.packages.find]
include = ["cyberlens*"]
